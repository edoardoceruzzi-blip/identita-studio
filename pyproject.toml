[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "identita-studio"
version = "0.1.0"
description = "Sessioni, capacita' e sicurezza condivise fra i programmi dello studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "argon2-cffi>=23.1,<25",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["identita_studio*"]
